# yaml-language-server: $schema=https://raw.githubusercontent.com/rendercv/rendercv/refs/tags/v2.8/schema.json

cv:
  name: Adrian Legaspi
  location: Monterrey, Mexico
  email: adrian.luball@gmail.com
  phone: '+526647809152'
  website: https://legaspi.dev
  social_networks:
    - network: LinkedIn
      username: adrian-legaspi
    - network: GitHub
      username: adrianlegaspi

  sections:
    Cover Letter:
      - 'Dear Confiz Hiring Team,'
      - 'I am applying for the Software Engineer Level III - React JS position. With more than nine years of experience building production software, I bring direct experience with React, TypeScript, JavaScript, SCSS, Node.js, AWS, and CI/CD.'
      - 'Most recently, I was the sole frontend engineer on a 15-person team, building a React and TypeScript dashboard that consolidates security findings across a Viasat platform used by 4,000+ internal users. I worked closely with backend engineers to turn complex requirements into a maintainable production application.'
      - 'I have also led a five-engineer team building an AI-enabled ERP product and delivered full-stack applications for fintech, legal, and public-safety users. Across these projects, I have integrated frontend systems with APIs, improved delivery workflows, and owned features from requirements through production.'
      - 'Confiz''s focus on collaborative problem solving, application quality, and maintainable React systems fits how I work. I would welcome the opportunity to contribute to your team.'
      - 'Adrian Legaspi'

design:
  theme: engineeringresumes
  page:
    size: us-letter
    top_margin: 0.6in
    bottom_margin: 0.6in
    left_margin: 0.6in
    right_margin: 0.6in
    show_footer: false
    show_top_note: false
  colors:
    body: rgb(0, 0, 0)
    name: rgb(0, 0, 0)
    headline: rgb(0, 0, 0)
    connections: rgb(0, 0, 0)
    section_titles: rgb(0, 0, 0)
    links: rgb(0, 0, 0)
    footer: rgb(128, 128, 128)
    top_note: rgb(128, 128, 128)
  typography:
    line_spacing: 0.6em
    alignment: justified
    date_and_location_column_alignment: right
    font_family:
      body: XCharter
      name: XCharter
      headline: XCharter
      connections: XCharter
      section_titles: XCharter
    font_size:
      body: 10pt
      name: 21pt
      headline: 10pt
      connections: 10pt
      section_titles: 1.2em
    small_caps:
      name: false
      headline: false
      connections: false
      section_titles: false
    bold:
      name: false
      headline: false
      connections: false
      section_titles: true
  links:
    underline: true
    show_external_link_icon: false
  header:
    alignment: center
    space_below_name: 0.35cm
    space_below_headline: 0.35cm
    space_below_connections: 0.35cm
    connections:
      phone_number_format: national
      hyperlink: true
      show_icons: false
      display_urls_instead_of_usernames: true
      separator: '|'
      space_between_connections: 0.5cm
  section_titles:
    type: with_full_line
    line_thickness: 0.5pt
    space_above: 0.35cm
    space_below: 0.25cm
  sections:
    allow_page_break: true
    space_between_text_based_entries: 0.3cm

locale:
  language: english

settings:
  current_date: today
  bold_keywords: []
  pdf_title: NAME - Cover Letter - Confiz React III
  render_command:
    output_folder: .
    pdf_path: Adrian_Legaspi_Cover_Letter_Confiz_React_III.pdf
    markdown_path: Adrian_Legaspi_Cover_Letter_Confiz_React_III.md
    dont_generate_markdown: false
    dont_generate_html: true
    dont_generate_png: true
    dont_generate_typst: false
