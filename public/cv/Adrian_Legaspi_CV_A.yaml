# yaml-language-server: $schema=https://raw.githubusercontent.com/rendercv/rendercv/refs/tags/v2.8/schema.json
#
# Variant A of Adrian_Legaspi_CV.yaml -- backend / semantic data platform roles.
# Same facts as the main CV, re-ordered so backend, data modeling and LLM work
# lead instead of frontend. Variants are lettered A, B, C...; what each one
# targets is stated in this comment, since the letter alone says nothing.
#
# The design block below is a copy of the main CV's and is kept in sync by hand,
# same as the cover letter.
#
# Rendered by `pnpm cv:generate cv-a`. Not part of the default run.
cv:
  name: Adrian Legaspi
  headline: Backend Engineer
  location: Monterrey, Mexico

  sections:
    profile:
      - 'Senior Software Engineer with 9+ years building backend services and REST APIs in Node.js, TypeScript and Python, across enterprise security, fintech and AI products.'
      - 'Designs ontologies and semantic data models in OWL, builds API-first and event-driven services on AWS, and ships LLM applications with RAG retrieval, vector search and agent orchestration. Professional-level English for technical and conversational communication.'

    experience:
      - company: JointechAI
        position: Software Engineer
        location: Tijuana, Mexico
        start_date: 2022-08
        end_date: present
        highlights:
          - '**Viasat Internal Security Application (via Borderux):** Designed and maintained the platform ontology and semantic data model, formalized as an OWL class and property hierarchy: products, the findings raised against them, and the assets that discover those findings. Government-contract security program; specifics under NDA.'
          - 'Maintained and evolved that taxonomy as the domain grew, gathering requirements directly from stakeholders as new sources and use cases arrived, and keeping products, findings and the assets that discover them queryable as one connected model instead of per-source silos.'
          - 'Integrated heterogeneous scanner and asset sources into that model through event-driven Lambda handlers, S3 event triggers, and inbound webhooks, with Redis caching on hot read paths and CloudWatch logs and alarms for operational visibility.'
          - 'Delivered Python AWS Lambda functions and REST API services behind API Gateway, each deployed and versioned independently, embedded in a backend-heavy team of 15.'
          - 'Built the centralized React and TypeScript dashboard that aggregates security findings for 4,000+ internal users, as the sole frontend engineer on the team.'
          - 'Worked across the platform AWS environment, including S3, EC2, CloudWatch and Lightsail, with services running in Docker containers and releases shipped through GitHub Actions.'
          - '**Agentic HR ERP (Jointech AI):** Tech Lead for a team of 5 engineers on the internal HR platform managing 30 employees and analyzing prospective roles and candidates for hiring.'
          - 'Built its Node.js, Express and TypeScript backend: REST API design, service integration, and the data model behind it, containerized with Docker across local and deployed environments.'
          - 'Implemented the RAG architecture covering document ingestion, chunking, embeddings and Chroma vector search, delivering grounded semantic search across heterogeneous HR and candidate documents.'
          - 'Developed agent orchestration and prompt-engineering workflows over Model Context Protocol, wiring retrieval and structured tools into LLM calls, plus model fine-tuning workflows. Built the React client on top of those services.'
          - 'Kept LLM behavior reliable in production with an LLM-as-a-judge evaluation step and prompt grading before release.'
          - '**Reciplease (via Borderux):** Built a Python and FastAPI backend that turns long-form recipe blog posts into clean, structured recipes, using the Gemini API for extraction and rewriting, backed by PostgreSQL and packaged with Docker.'
          - 'Published its endpoints against an OpenAPI contract, with Firebase Auth for access control and event-driven Firebase triggers running background processing.'

      - company: Arte Digital
        position: Software Engineer
        location: Tijuana, Mexico
        start_date: 2020-01
        end_date: 2022-08
        highlights:
          - '**Captira:** Designed and built secure Laravel REST APIs serving 3,000+ legal professionals, with the relational data model behind them.'
          - 'Built complex Angular data dashboards on those APIs, covering case, document and reporting workflows.'
          - '**Crediverso:** Architected and shipped full-stack fintech features for a platform serving 10,000 users, on React and a headless WordPress backend.'
          - 'Established the CI/CD pipelines with Codeship, later migrating them to AWS CodePipeline, cutting deployment time for the team.'

      - company: LuballSoftware (Freelance)
        position: Web Designer & Developer
        location: Tijuana, Mexico
        start_date: 2016-03
        end_date: 2020-01
        highlights:
          - 'Developed and managed FireApp, a digital logging application for the Tijuana Fire Department used by 180+ field firefighters and paramedics across 18 stations for pre-hospital incident reports.'
          - 'Delivered 25+ web solutions for local businesses over 4 years, ranging from custom e-commerce platforms to landing pages.'

    education:
      - institution: Universidad Tecnológica de Tijuana
        area: Tecnologías de la Información
        degree: BS
        location: Tijuana, Mexico
        end_date: 2015-05

    skills:
      - label: Ontologies & Semantic Data
        details: OWL ontologies, semantic data models, taxonomies, class and property hierarchies, domain modeling
      - label: Backend & API Engineering
        details: Node.js, Express, TypeScript, Python, FastAPI, REST API design, OpenAPI contracts, AWS Lambda, API Gateway, PostgreSQL, Redis, Firebase Auth, Laravel (PHP)
      - label: Architecture & Integration
        details: Serverless microservices, event-driven handlers (S3 events, Firebase triggers, webhooks), asynchronous workflows, service-to-service integration, data integration patterns, Model Context Protocol
      - label: Generative AI & Semantic Search
        details: RAG architectures, Chroma vector search, embeddings, semantic retrieval, agent orchestration, prompt engineering, LLM-as-a-judge evaluation, fine-tuning, Gemini APIs
      - label: Cloud & DevOps
        details: AWS (Lambda, API Gateway, S3, EC2, CloudWatch, Lightsail), Docker, CI/CD (GitHub Actions, AWS CodePipeline, Codeship), software architecture
      - label: Frontend
        details: React, TypeScript, Angular, SCSS

    languages:
      - label: English
        details: Professional proficiency, nine years of daily technical collaboration with US-based clients and teams
      - label: Spanish
        details: Native

    Side projects:
      - name: 'Shroom Merge ([Play Store](https://play.google.com/store/apps/details?id=dev.procreations.shroommerge), [App Store](https://apps.apple.com/us/app/kinoko-merge/id6785820123))'
        date: 'July 2026'
        highlights:
          - 'Independently developed and released Shroom Merge (Kinoko Merge on iOS), a mobile merge game, taking the project from concept to Play Store and App Store launch.'

design:
  theme: engineeringresumes
  page:
    # us-letter is ~18mm shorter than a4, so this fits on one page only because
    # the header/section whitespace below is tightened. Loosening those values
    # (or adding content) pushes the last project onto a second page.
    size: us-letter
    top_margin: 0.6in
    bottom_margin: 0.6in
    left_margin: 0.6in
    right_margin: 0.6in
    show_footer: false
    show_top_note: false
  colors:
    body: rgb(0, 0, 0)
    name: rgb(0, 0, 0)
    headline: rgb(0, 0, 0)
    connections: rgb(0, 0, 0)
    section_titles: rgb(0, 0, 0)
    links: rgb(0, 0, 0)
    footer: rgb(128, 128, 128)
    top_note: rgb(128, 128, 128)
  typography:
    line_spacing: 0.6em
    alignment: justified
    date_and_location_column_alignment: right
    font_family:
      body: XCharter
      name: XCharter
      headline: XCharter
      connections: XCharter
      section_titles: XCharter
    font_size:
      body: 9.5pt
      name: 21pt
      headline: 10pt
      connections: 10pt
      section_titles: 1.2em
    small_caps:
      name: false
      headline: false
      connections: false
      section_titles: false
    bold:
      name: false
      headline: false
      connections: false
      section_titles: true
  links:
    underline: true
    show_external_link_icon: false
  header:
    alignment: center
    photo_width: 3.5cm
    photo_position: left
    photo_space_left: 0.4cm
    photo_space_right: 0.4cm
    space_below_name: 0.35cm
    space_below_headline: 0.35cm
    space_below_connections: 0.35cm
    connections:
      phone_number_format: national
      hyperlink: true
      show_icons: false
      display_urls_instead_of_usernames: true
      separator: '|'
      space_between_connections: 0.5cm
  section_titles:
    type: with_full_line
    line_thickness: 0.5pt
    space_above: 0.35cm
    space_below: 0.25cm
  sections:
    allow_page_break: true
    space_between_regular_entries: 0.32cm
    space_between_text_based_entries: 0.15cm
    show_time_spans_in: []
  entries:
    date_and_location_width: 4.15cm
    side_space: 0cm
    space_between_columns: 0.1cm
    allow_page_break: false
    short_second_row: false
    degree_width: 1cm
    summary:
      space_above: 0.08cm
      space_left: 0cm
    highlights:
      bullet: ●
      nested_bullet: ●
      space_left: 0cm
      space_above: 0.08cm
      space_between_items: 0.08cm
      space_between_bullet_and_text: 0.3em
  templates:
    footer: '*NAME -- PAGE_NUMBER/TOTAL_PAGES*'
    top_note: '*LAST_UPDATED CURRENT_DATE*'
    single_date: MONTH_ABBREVIATION YEAR
    date_range: START_DATE – END_DATE
    time_span: HOW_MANY_YEARS YEARS HOW_MANY_MONTHS MONTHS
    one_line_entry:
      main_column: '**LABEL:** DETAILS'
    education_entry:
      main_column: |-
        **INSTITUTION**, DEGREE_WITH_AREA -- LOCATION
        SUMMARY
        HIGHLIGHTS
      degree_column:
      date_and_location_column: DATE
    normal_entry:
      main_column: |-
        **NAME** -- **LOCATION**
        SUMMARY
        HIGHLIGHTS
      date_and_location_column: DATE
    experience_entry:
      main_column: |-
        **POSITION**, COMPANY -- LOCATION
        SUMMARY
        HIGHLIGHTS
      date_and_location_column: DATE
    publication_entry:
      main_column: |-
        **TITLE**
        SUMMARY
        AUTHORS
        URL (JOURNAL)
      date_and_location_column: DATE

locale:
  language: english
  last_updated: Last updated in
  month: month
  months: months
  year: year
  years: years
  present: present
  phrases:
    degree_with_area: DEGREE in AREA
  month_abbreviations:
    - Jan
    - Feb
    - Mar
    - Apr
    - May
    - June
    - July
    - Aug
    - Sept
    - Oct
    - Nov
    - Dec
  month_names:
    - January
    - February
    - March
    - April
    - May
    - June
    - July
    - August
    - September
    - October
    - November
    - December

settings:
  current_date: today
  bold_keywords: []
  pdf_title: NAME - CV
  render_command:
    # Paths below are resolved relative to THIS file's directory (public/cv/),
    # not the directory rendercv is invoked from.
    output_folder: .
    # These two are only the fallback for a bare `rendercv render`. The real
    # filenames are versioned (Adrian_Legaspi_CV_v10.pdf) and are passed in by
    # scripts/generate-cv.js via --pdf-path / --markdown-path, so the version
    # number lives in one place instead of being hand-edited here every release.
    # Use `npm run generate-cv`, not the rendercv CLI directly.
    pdf_path: Adrian_Legaspi_CV_A.pdf
    # Generated output, not a source file. Edit the .yaml, never the .md.
    markdown_path: Adrian_Legaspi_CV_A.md
    dont_generate_markdown: false
    dont_generate_html: true
    dont_generate_png: true
    # Keep Typst enabled: the PDF is compiled from the .typ file, so disabling
    # it silently produces no PDF at all.
    dont_generate_typst: false
